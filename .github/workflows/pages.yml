name: Deploy static PWA to GitHub Pages

on:
  workflow_run:
    workflows: [Quality]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify tested revision is still current
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$CURRENT_SHA" = "$TESTED_SHA" || { echo 'A newer revision exists; refusing stale deployment.'; exit 1; }
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html offline.html sw.js manifest.json favicon.svg robots.txt sitemap.xml .nojekyll _site/
          cp -R css js fonts pages _site/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
