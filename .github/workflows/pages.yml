name: Deploy static PWA to GitHub Pages

on:
  workflow_run:
    workflows: [Quality]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check whether the tested revision is current
        id: revision
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$CURRENT_SHA" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping stale deployment for $TESTED_SHA; main is at $CURRENT_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Pages
        if: steps.revision.outputs.current == 'true'
        uses: actions/configure-pages@v6
      - name: Prepare website files
        if: steps.revision.outputs.current == 'true'
        run: |
          mkdir -p _site
          cp index.html offline.html sw.js manifest.json favicon.svg robots.txt sitemap.xml .nojekyll _site/
          cp -R css js fonts pages icons _site/
      - name: Upload static site
        if: steps.revision.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        if: steps.revision.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
