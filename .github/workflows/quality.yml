name: Quality

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full visual and performance suite
        type: boolean
        default: false
  schedule:
    - cron: '17 19 * * 0'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use Ubuntu HTTPS mirror for browser dependencies
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run audit
      - run: npm audit
      - name: Fast regression checks
        if: github.event_name != 'schedule' && inputs.full_suite != true
        run: npm run test:quick -- --project=${{ matrix.project }}
      - name: Full regression checks
        if: github.event_name == 'schedule' || inputs.full_suite == true
        run: npm run test:ui -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
