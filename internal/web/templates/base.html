<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}Macro Longevity{{end}}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="nav-logo">
                <span class="nav-logo-icon">⟁</span>
                <span class="nav-logo-text">MacroLongevity</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link {{if eq .ActiveNav "home"}}active{{end}}">Home</a>
                <a href="/biomarkers" class="nav-link {{if eq .ActiveNav "biomarkers"}}active{{end}}">Biomarkers</a>
                <a href="/food" class="nav-link {{if eq .ActiveNav "food"}}active{{end}}">Food</a>
                <a href="/supplements" class="nav-link {{if eq .ActiveNav "supplements"}}active{{end}}">Supplements</a>
            </div>
        </div>
    </nav>

    <main>
        {{block "content" .}}{{end}}
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <span class="footer-logo">⟁</span>
                <span>MacroLongevity</span>
