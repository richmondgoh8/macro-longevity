<!DOCTYPE html>

<head>

    <nav class="nav" aria-label="Primary navigation">

    <main>
        <section class="page-header">
            <div class="section-inner">
                <h1 class="page-title">You're Offline</h1>

        </section>
        <section class="section">

                <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center">

                    <a href="pages/finance.html" style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-bg-card);text-decoration:none;font-weight:600;color:var(--color-text)">Finance</a>
                </div>
            </div>
        </section>
